<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valencia Streets | Portfolio</title>
  <link rel="stylesheet" href="css/gallery.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <!-- Gallery Section -->
    <section class="gallery-section" id="photography">
      <div class="section-header">
        <div class="section-titles">
          <span class="section-eyebrow">Film Exhibition</span>
          <h2 class="section-title">
            <span class="title-main">Valencia</span>
            <span class="title-sub">Winter 2024 · Lumix G85</span>
          </h2>
        </div>
      </div>

      <div class="gallery-divider">
        <span class="divider-line"></span>
        <span class="divider-line"></span>
      </div>

      <div class="gallery-grid">
        <!-- Large hero shot -->
        <figure class="gallery-item gallery-item--hero">
          <div class="gallery-frame">
            <img
              src="Assets/Photos/valencia/P1040804.jpg"
              alt="Narrow Valencia alley at golden hour with Mercado Central tower glowing in the distance"
              loading="lazy"
              class="gallery-image"
              data-full="Assets/Photos/valencia/P1040804.jpg"
            >
            <figcaption class="gallery-caption">El Carmen, Valencia · 2024 · Lumix G85</figcaption>
          </div>
        </figure>

        <!-- Medium shots cluster -->
        <figure class="gallery-item gallery-item--medium">
          <div class="gallery-frame">
            <img
              src="Assets/Photos/valencia/P1040802.jpg"
              alt="Ornate flatiron building rising against winter sky in Valencia"
              loading="lazy"
              class="gallery-image"
              data-full="Assets/Photos/valencia/P1040802.jpg"
            >
            <figcaption class="gallery-caption">Plaza del Ayuntamiento · Winter 2024</figcaption>
          </div>
        </figure>

        <figure class="gallery-item gallery-item--medium">
          <div class="gallery-frame">
            <img
              src="Assets/Photos/valencia/P1040798.jpg"
              alt="Grand plaza intersection with classic Valencian architecture and zebra crossing"
              loading="lazy"
              class="gallery-image"
              data-full="Assets/Photos/valencia/P1040798.jpg"
            >
            <figcaption class="gallery-caption">Plaza del Ayuntamiento · 2024</figcaption>
          </div>
        </figure>

        <figure class="gallery-item gallery-item--small">
          <div class="gallery-frame">
            <img
              src="Assets/Photos/valencia/P1040793.jpg"
              alt="Pedestrians walking past El Corte Inglés on Calle Colón"
              loading="lazy"
              class="gallery-image"
              data-full="Assets/Photos/valencia/P1040793.jpg"
            >
            <figcaption class="gallery-caption">Calle Colón · 35mm equiv.</figcaption>
          </div>
        </figure>

        <figure class="gallery-item gallery-item--small">
          <div class="gallery-frame">
            <img
              src="Assets/Photos/valencia/P1040818.jpg"
              alt="Looking up between cream and ochre buildings in El Carmen"
              loading="lazy"
              class="gallery-image"
              data-full="Assets/Photos/valencia/P1040818.jpg"
            >
            <figcaption class="gallery-caption">El Carmen · 2024</figcaption>
          </div>
        </figure>

        <figure class="gallery-item gallery-item--wide">
          <div class="gallery-frame">
            <img
              src="Assets/Photos/valencia/P1040796.jpg"
              alt="Central Valencia street with vanishing point perspective and pedestrians"
              loading="lazy"
              class="gallery-image"
              data-full="Assets/Photos/valencia/P1040796.jpg"
            >
            <figcaption class="gallery-caption">Centro Histórico · Winter 2024 · Lumix G85</figcaption>
          </div>
        </figure>

        <figure class="gallery-item gallery-item--medium">
          <div class="gallery-frame">
            <img
              src="Assets/Photos/valencia/P1040794.jpg"
              alt="Elegant corner building with iron balconies and palm trees at sunset"
              loading="lazy"
              class="gallery-image"
              data-full="Assets/Photos/valencia/P1040794.jpg"
            >
            <figcaption class="gallery-caption">Plaza de la Reina · 2024</figcaption>
          </div>
        </figure>

        <figure class="gallery-item gallery-item--small">
          <div class="gallery-frame">
            <img
              src="Assets/Photos/valencia/P1040800.jpg"
              alt="Street corner with cafe terrace and classic European architecture"
              loading="lazy"
              class="gallery-image"
              data-full="Assets/Photos/valencia/P1040800.jpg"
            >
            <figcaption class="gallery-caption">Ciutat Vella · Winter 2024</figcaption>
          </div>
        </figure>

        <figure class="gallery-item gallery-item--medium">
          <div class="gallery-frame">
            <img
              src="Assets/Photos/valencia/P1040819.jpg"
              alt="Winter trees and pedestrians on a cobbled Valencia street"
              loading="lazy"
              class="gallery-image"
              data-full="Assets/Photos/valencia/P1040819.jpg"
            >
            <figcaption class="gallery-caption">Barrio del Carmen · 2024 · Lumix G85</figcaption>
          </div>
        </figure>
      </div>

      <div class="gallery-footer">
        <span class="footer-line"></span>
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="lightbox-close" aria-label="Close lightbox">
      <span class="close-icon"></span>
    </button>
    <button class="lightbox-nav lightbox-nav--prev" aria-label="Previous image">
      <span class="nav-arrow"></span>
    </button>
    <button class="lightbox-nav lightbox-nav--next" aria-label="Next image">
      <span class="nav-arrow"></span>
    </button>
    <figure class="lightbox-content">
      <img src="" alt="" class="lightbox-image">
      <figcaption class="lightbox-caption"></figcaption>
    </figure>
  </div>

  <script src="js/gallery.js"></script>
</body>
</html>
